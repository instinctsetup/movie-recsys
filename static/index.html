<!doctype html><meta charset="utf-8"><title>Movie RecSys</title>
<style>
body{font-family:system-ui;max-width:960px;margin:2rem auto;padding:0 1rem;background:#0f1220;color:#e8e8f0}
h1{margin-bottom:.2rem}.sub{color:#9aa0b5;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem;margin:1rem 0}
.card{background:#1a1e32;border-radius:8px;padding:.6rem .8rem}
.card b{font-size:.92rem}.year{color:#9aa0b5;font-size:.8rem}
.stars button{background:none;border:none;color:#555;cursor:pointer;font-size:1.1rem;padding:0 .05rem}
.stars button.on{color:#f5c518}
button.cta{background:#f5c518;border:none;border-radius:6px;padding:.6rem 1.2rem;font-weight:600;cursor:pointer}
.rec{background:#16281c;border-radius:8px;padding:.7rem .9rem;margin:.5rem 0}
.why{color:#8fce9f;font-size:.85rem}
#status{color:#9aa0b5;font-size:.85rem;margin:.5rem 0}
</style>
<h1>Movie RecSys</h1>
<p class="sub">Matrix factorization from scratch (SGD, NumPy) on MovieLens 100k.
Test RMSE <b id="rmse">?</b> vs 1.154 global-mean baseline. Rate at least 5 movies, then get picks.</p>
<div id="status"></div>
<div class="grid" id="grid"></div>
<button class="cta" onclick="go()">Get my top 10</button>
<div id="recs"></div>
<script>
const ratings={};
fetch('/api/catalog').then(r=>r.json()).then(d=>{
  document.getElementById('rmse').textContent=d.eval.rmse_test;
  grid.innerHTML=d.movies.map(m=>`<div class="card"><b>${m.title}</b> <span class="year">${m.year}</b>
    <div class="stars" data-id="${m.id}">${[1,2,3,4,5].map(v=>`<button data-v="${v}" onclick="rate(this)">★</button>`).join('')}</div></div>`).join('');
  status.textContent='0 rated';
});
function rate(btn){
  const id=+btn.parentElement.dataset.id, v=+btn.dataset.v;
  ratings[id]=v;
  [...btn.parentElement.children].forEach(b=>b.classList.toggle('on',+b.dataset.v<=v));
  status.textContent=Object.keys(ratings).length+' rated';
}
async function go(){
  const r=await fetch('/api/recommend',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ratings})});
  const d=await r.json();
  if(d.error){status.textContent=d.error;return;}
  recs.innerHTML='<h2>Your top 10</h2>'+d.recommendations.map(m=>
    `<div class="rec"><b>${m.title}</b> <span class="year">${m.year}</span> - predicted ${m.score}
     ${m.because?`<div class="why">because you liked ${m.because}</div>`:''}</div>`).join('');
}
</script>
